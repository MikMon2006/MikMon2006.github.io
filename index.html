.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}

const sv=()=>{try{localStorage.setItem('mc',JSON.stringify(S))}catch(e){}};
const fail=e=>alert('Could not save: '+(e.code||e.message)+'\nAre you logged in as the owner, and are the Firestore rules published?');
async function put(c,o){try{if(demo){const a=S[c],i=a.findIndex(x=>x.id==o.id);i<0?a.push(o):a[i]=o;sv();render()}else await setDoc(doc(db,c,o.id),o)}catch(e){fail(e)}}
async function del(c,id){try{if(demo){S[c]=S[c].filter(x=>x.id!=id);sv();render()}else await deleteDoc(doc(db,c,id))}catch(e){fail(e)}}
async function many(c,list){try{if(demo){S[c].push(...list);sv();render()}else for(let i=0;i<list.length;i+=400){const b=writeBatch(db);list.slice(i,i+400).forEach(o=>b.set(doc(db,c,o.id),o));await b.commit()}}catch(e){fail(e)}}
if(demo){try{Object.assign(S,JSON.parse(localStorage.getItem('mc'))||{})}catch(e){}
  if(!S.items.length&&!localStorage.getItem('mcSeed')){S.items=SEED.map(x=>({...x}));S.memos=SEED_MEMOS.map(x=>({...x}));sv();try{localStorage.setItem('mcSeed','1')}catch(e){}}setTimeout(()=>{ready=true;render()},700)}
else{
  const app=initializeApp(CFG);db=getFirestore(app);auth=getAuth(app);
  onSnapshot(collection(db,'items'),s=>{S.items=s.docs.map(d=>d.data());ready=true;render()});
  onSnapshot(collection(db,'memos'),s=>{S.memos=s.docs.map(d=>d.data());render()});
  onAuthStateChanged(auth,u=>{owner=!!u&&u.email===OWNER_EMAIL;render()});
}

/* ---------- helpers ---------- */
const decOf=y=>!y||y<1950?'':y>=2000?'2000':String(Math.floor(y/10)*10);
const decLabel=d=>d==='2000'?'2000s-Now':d+'s';
const owned=()=>S.items.filter(i=>i.status!=='wishlist');
const count=l=>({vinyl:l.filter(i=>i.format=='vinyl').length,cd:l.filter(i=>i.format=='cd').length,dvd:l.filter(i=>i.format=='dvd').length,cassette:l.filter(i=>i.format=='cassette').length,total:l.length});
const genres=()=>{const m=new Map();[...DEF_GENRES,...S.items.flatMap(i=>(i.genre||'').split(','))].forEach(g=>{g=(g||'').trim();if(g&&!m.has(g.toLowerCase()))m.set(g.toLowerCase(),g)});return [...m]};
function match(i,st){
  if((i.status==='wishlist')!==(st==='wishlist'))return false;
  if(F.fmt=='v12'&&!(i.format=='vinyl'&&i.size=='12'))return false;
  if(F.fmt=='v7'&&!(i.format=='vinyl'&&i.size=='7'))return false;
  if(['vinyl','cd','dvd','cassette'].includes(F.fmt)&&i.format!==F.fmt)return false;
  if(F.genre!=='all'&&!(i.genre||'').toLowerCase().split(',').map(x=>x.trim()).includes(F.genre))return false;
  if(F.at!=='all'&&!(i.artistType||'').split(',').includes(F.at))return false;
  if(F.dec!=='all'&&decOf(i.year)!==F.dec)return false;
  const q=F.q.toLowerCase();return !q||(i.title+' '+i.artist).toLowerCase().includes(q);
}
const normDate=s=>{s=(s||'').trim();let m;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;if(m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/))return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return today()};
function splitCsv(l){const r=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch=='"'){if(q&&l[i+1]=='"'){c+='"';i++}else q=!q}else if(ch==','&&!q){r.push(c);c=''}else c+=ch}r.push(c);return r.map(x=>x.trim())}
function parseLines(text,status){
  return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
    const c=l.includes('\t')?l.split('\t'):(l.match(/\|/g)||[]).length>=3?l.split('|'):splitCsv(l);
    const t=c.map(x=>x.trim());if(t[0].toLowerCase()==='title')return null;
    const f=(t[2]||'').toLowerCase();let format=/dvd/.test(f)?'dvd':/cass|tape/.test(f)?'cassette':/\bcd\b|compact/.test(f)?'cd':/vinyl|lp|record|45|12|7/.test(f)?'vinyl':'';
    let size='';if(format==='vinyl')size=/7/.test((t[3]||'')+f)?'7':'12';
    const y=parseInt(t[6]);
    const st=/wish/i.test(t[9]||'')?'wishlist':/own/i.test(t[9]||'')?'owned':status;
    return {id:uid(),title:t[0],artist:t[1]||'',format,size,genre:t[4]||'Other',artistType:/band/i.test(t[5]||'')&&/solo/i.test(t[5]||'')?'band,solo':/solo/i.test(t[5]||'')?'solo':'band',year:y>0?y:0,dateAdded:normDate(t[7]),cover:t[8]||'',status:st,ok:!!(t[0]&&format)};
  }).filter(Boolean);
}

function render(){

  if(tab=='home')renderHome();
  if(tab=='cat'||tab=='wish'){renderChips();renderList()}
  if(tab=='memos')renderMemos();
}
function renderHome(){
  const c=count(owned()),max=Math.max(1,...Object.values(c).slice(0,4));
  const dates=[...new Set(owned().map(i=>i.dateAdded||'').filter(Boolean))].sort();

  $('#home').innerHTML=`<h1 class="hero">Welcome to my collection</h1>
  <div>Vinyl, CDs, DVDs and cassettes. Browse, search and filter in the Catalog tab.</div>

  ${(logAll?rows:rows.slice(0,8)).map(r=>`<tr><td>${fmtD(r.d)}</td><td>${r.vinyl}</td><td>${r.cd}</td><td>${r.dvd}</td><td>${r.cassette}</td><td><b>${r.total}</b></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No items yet. Log in as the owner and use + Add Media.</td></tr>'}</table></div>${rows.length>8?`<p><button data-act="logall">${logAll?'Show recent only':'Show all '+rows.length+' dates'}</button></p>`:''}`;
}
function renderChips(){

  const chip=(g,v,l)=>`<button class="${F[g]==v?'on':''}" data-f="${g}" data-v="${esc(v)}">${esc(l)}</button>`;

    row('Genre:',chip('genre','all','All')+genres().map(([k,l])=>chip('genre',k,l)).join('')+(owner?'<button data-act="gen">+ Genre</button>':''))+

}
const card=(i,st)=>`<div class="card"><div class="cv ${i.format}"><span>${ICON[i.format]}</span>${/^https?:\/\//.test(i.cover||'')?`<img loading="lazy" alt="" src="${esc(i.cover)}" onerror="this.remove()">`:''}</div>

function renderList(){

}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button');if(!b)return;
  const d=b.dataset,id=d.id;
  if(d.tab){tab=d.tab;F.fmt=F.genre=F.at=F.dec='all';render();return}
  if(d.f){F[d.f]=d.v.toLowerCase()==d.v||d.f!=='genre'?d.v:d.v;renderChips();renderList();return}
  switch(d.act){
    case'close':close();break;
    case'seed':await many('items',SEED);if(!S.memos.length)await many('memos',SEED_MEMOS);break;
    case'logall':logAll=!logAll;renderHome();break;
    case'ft':$('#chips').classList.toggle('open');break;
    case'add':openAdd(null);break;
    case'login':login();break;
    case'dologin':try{await signInWithEmailAndPassword(auth,$('#le').value,$('#lp').value);close()}catch(e){alert('Login failed: '+(e.code||e.message))}break;
    case'm1':openAdd(null,'single');break;
    case'm2':openAdd(null,'bulk');break;
    case'save':{
      const g=k=>$('#f_'+k).value.trim(),fmt=g('format');
      if(!g('title'))return alert('Title is required.');
      await put('items',{id:id||uid(),title:g('title'),artist:g('artist'),format:fmt,size:fmt=='vinyl'?g('size'):'',genre:g('genre')||'Other',artistType:g('at'),year:parseInt(g('year'))||0,dateAdded:g('date')||today(),cover:g('cover'),status:g('st')});close();break}
    case'prev':prev();break;
    case'sample':$('#bt').value='Rumours | Fleetwood Mac | Vinyl | 12 | Rock | Band | 1977 | '+today()+'\nHey Jude | The Beatles | Vinyl | 7 | Rock | Band | 1968 | '+today()+'\nThriller | Michael Jackson | CD | | Pop | Solo | 1982 | '+today()+'\nTitanic OST | James Horner | Cassette | | Soundtracks | Solo | 1997 | '+today();break;
    case'bulk':{const ok=pending.filter(p=>p.ok).map(({ok,...r})=>r);await many('items',ok);close();alert(ok.length+' items added.');break}
    case'ed':openAdd(S.items.find(i=>i.id==id));break;
    case'rm':if(needOwner()&&confirm('Delete this item?'))del('items',id);break;
    case'mv':{const i=S.items.find(x=>x.id==id);put('items',{...i,status:'owned',dateAdded:today()});break}
    case'gen':{const g=prompt('New genre name:');if(g&&g.trim()){openAdd(null);$('#f_genre').value=g.trim()}break}
    case'memo':{const t=$('#mt').value.trim();if(t)put('memos',{id:uid(),text:t,date:new Date().toISOString().slice(0,16).replace('T',' ')});break}
    case'rmm':if(confirm('Delete this memo?'))del('memos',id);break;
    case'xj':download('media-catalog-'+today()+'.json',JSON.stringify({items:S.items,memos:S.memos},null,2),'application/json');break;
    case'xc':download('media-catalog-'+today()+'.csv',['Title,Artist,Format,Size,Genre,ArtistType,Year,DateAdded,Cover,Status',...S.items.map(i=>[i.title,i.artist,FM[i.format],i.size,i.genre,i.artistType,i.year,i.dateAdded,i.cover,i.status].map(csvq).join(','))].join('\n'),'text/csv');break;
    case'imp':if(needOwner())$('#file').click();break;
  }
});
document.addEventListener('change',ev=>{if(ev.target.id=='f_format')sizeToggle()});
$('#q').addEventListener('input',e=>{F.q=e.target.value;renderList()});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;const t=await f.text();
  try{
    if(f.name.endsWith('.json')){const j=JSON.parse(t),it=(Array.isArray(j)?j:j.items||[]).map(x=>({...x,id:x.id||uid()})),me=(j.memos||[]).map(x=>({...x,id:x.id||uid()}));
      if(!confirm(`Import ${it.length} items and ${me.length} memos? Matching IDs are overwritten.`))return;await many('items',it);if(me.length)await many('memos',me)}
    else{const it=parseLines(t,'owned').filter(p=>p.ok).map(({ok,...r})=>r);if(!confirm(`Import ${it.length} items from this file?`))return;await many('items',it)}
    alert('Import finished.');
  }catch(err){alert('Import failed: '+err.message)}
});
/* ---------- install as app (PWA) ---------- */
let dip;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#inst').style.display=''});
addEventListener('appinstalled',()=>{$('#inst').style.display='none'});
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(ios&&!standalone)$('#inst').style.display='';
document.addEventListener('click',async ev=>{
  if(!ev.target.closest('[data-act=install]'))return;
  if(dip){dip.prompt();await dip.userChoice;dip=null;$('#inst').style.display='none'}
  else alert(ios?'On iPhone/iPad: tap the Share button in Safari, then "Add to Home Screen".':'Open your browser menu and choose "Install app" or "Add to Home screen".');
});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const clk=()=>$('#clk').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});clk();setInterval(clk,30000);
render();
</script>
</body>
